[pie_chart]
center_hole = "#14161B"
slice_stroke = "#14161B"
min_slice_degrees = 1.5
palette = [
    "#3B82F6",
    "#22C55E",
    "#F59E0B",
    "#EF4444",
    "#A855F7",
    "#06B6D4",
    "#EC4899",
    "#84CC16",
]

[health_widget]
card_bg = "#181A20"
bar_track = "#2A2E39"
bar_healthy = "#22C55E"
bar_warning = "#F59E0B"
bar_critical = "#EF4444"
