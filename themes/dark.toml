name = "Dark Slate"
is_dark = true

[window]
background = "#14161B"
panel_background = "#1A1D24"
card_background = "#222630"
border = "#2E3440"
accent = "#3B82F6"

[text]
primary = "#F3F4F6"
secondary = "#9CA3AF"
muted = "#6B7280"
scanning = "#38BDF8"
ready = "#4ADE80"
warning = "#FBBF24"
critical = "#F87171"

[file_list]
row_hover = "#262B36"
row_selected = "#2D3545"
size_bar_fill = "#1E3A5F"
folder_icon = "#60A5FA"
