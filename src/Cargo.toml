[package]
name = "diskscope_v3"
version = "3.0.0"
edition = "2021"
build = "build.rs"
description = "Cross-platform GUI & Headless Server disk space analyzer with SQLite indexing and animated Slime Health widget."

[[bin]]
name = "diskscope_v3"
path = "main.rs"

[dependencies]
eframe = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
trash = "5.2"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
