<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskScope v0.03 — Web GUI</title>
    <style>
        :root {
            --bg: #f3f5f8;
            --panel: #ffffff;
            --panel-alt: #eaedf2;
            --border: #d0d7e2;
            --text: #1b222c;
            --muted: #526075;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --green: #16a34a;
            --yellow: #d97706;
            --red: #dc2626;
            --bar-fill: rgba(37, 99, 235, 0.14);
            --donut-hole: #ffffff;
        }

        body.dark {
            --bg: #111318;
            --panel: #181b22;
            --panel-alt: #1f232d;
            --border: #2a303d;
            --text: #e6eaf2;
            --muted: #8b95a7;
            --accent: #4c8dff;
            --accent-hover: #6aa1ff;
            --green: #38c976;
            --yellow: #f5b942;
            --red: #ef5350;
            --bar-fill: rgba(76, 141, 255, 0.22);
            --donut-hole: #181b22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.15s, color 0.15s;
        }

        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .brand {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
            margin-right: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select, input, button, a.btn-link {
            background: var(--panel-alt);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12.5px;
            outline: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

            select:focus, input:focus {
                border-color: var(--accent);
            }

        button, a.btn-link {
            cursor: pointer;
            font-weight: 600;
            transition: background 0.15s, border-color 0.15s;
        }

            button:hover:not(:disabled), a.btn-link:hover {
                filter: brightness(0.95);
            }

            button:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }

            button.primary, a.btn-link.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }

                button.primary:hover:not(:disabled), a.btn-link.primary:hover {
                    background: var(--accent-hover);
                    filter: none;
                }

            button.danger {
                color: var(--red);
                border-color: rgba(220, 38, 38, 0.35);
                padding: 3px 8px;
                font-size: 11.5px;
            }

                button.danger:hover {
                    background: rgba(220, 38, 38, 0.12);
                }

        .media-pill {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--accent);
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(37, 99, 235, 0.28);
            padding: 1px 6px;
            border-radius: 4px;
            text-decoration: none;
        }

            .media-pill:hover {
                background: var(--accent);
                color: #fff;
            }

        .path-bar {
            flex: 1;
            min-width: 180px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 10px;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-strip {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 5px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
        }

            .dot.scanning {
                background: var(--yellow);
                animation: pulse 0.9s infinite alternate;
            }

        @keyframes pulse {
            from {
                opacity: 0.4;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .progress-track {
            width: 180px;
            height: 6px;
            background: var(--panel-alt);
            border-radius: 999px;
            overflow: hidden;
            display: none;
        }

            .progress-track.active {
                display: block;
            }

        .progress-fill {
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, var(--accent), var(--green));
            animation: indeterminate 1.1s infinite ease-in-out;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(240%);
            }
        }

        .searchbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

            .searchbar input {
                flex: 1;
            }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        @media (max-width: 860px) {
            .workspace {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
        }

        .browser-pane {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 8px 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--muted);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

            .file-list.slide-forward {
                animation: slideInRight 0.18s cubic-bezier(0.22, 1, 0.36, 1);
            }

            .file-list.slide-backward {
                animation: slideInLeft 0.18s cubic-bezier(0.22, 1, 0.36, 1);
            }

        @keyframes slideInRight {
            from {
                opacity: 0.4;
                transform: translateX(28px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0.4;
                transform: translateX(-28px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .file-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            margin-bottom: 3px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            overflow: hidden;
            user-select: none;
        }

            .file-row:hover:not(.locked) {
                border-color: var(--border);
                background: rgba(128, 128, 128, 0.06);
            }

            .file-row.locked {
                opacity: 0.58;
                cursor: not-allowed;
            }

        .size-bg {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: var(--bar-fill);
            pointer-events: none;
            z-index: 0;
        }

        .row-left, .row-right {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row-left {
            min-width: 0;
            flex: 1;
        }

        .item-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

            .item-name.playable {
                color: var(--accent);
            }

                .item-name.playable:hover {
                    text-decoration: underline;
                }

        .item-sub {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .size-badge {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            color: var(--text);
            min-width: 72px;
            text-align: right;
        }

        .unscanned-tag {
            font-size: 10.5px;
            color: var(--muted);
            background: var(--panel-alt);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .scanning-tag {
            font-size: 10.5px;
            color: var(--yellow);
            background: rgba(217, 119, 6, 0.14);
            border: 1px solid rgba(217, 119, 6, 0.35);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .viz-pane {
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            overflow-y: auto;
            background: var(--bg);
        }

        .pill-switch {
            display: inline-flex;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            align-self: center;
        }

        .pill-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

            .pill-btn.active {
                background: var(--accent);
                color: #fff;
            }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .pie-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        canvas#pieCanvas {
            max-width: 240px;
            max-height: 240px;
        }

        .legend {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 6px 12px;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }

        .swatch {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .legend-sz {
            color: var(--muted);
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11px;
        }

        .health-card {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: auto;
        }

        .slime-stage {
            width: 68px;
            height: 68px;
            border-radius: 8px;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .slime-img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            transform-origin: bottom center;
        }

            .slime-img.happy {
                animation: slimeHappy 1.35s infinite ease-in-out;
            }

            .slime-img.shiver {
                animation: slimeShiver 0.16s infinite alternate ease-in-out;
            }

            .slime-img.dead {
                animation: slimeDead 2.2s infinite ease-in-out;
            }

        @keyframes slimeHappy {
            0%, 100% {
                transform: translateY(0) scale(1.06, 0.94);
            }

            45% {
                transform: translateY(-10px) scale(0.92, 1.12);
            }
        }

        @keyframes slimeShiver {
            from {
                transform: translateX(-2.5px) scale(1.03, 0.96);
            }

            to {
                transform: translateX(2.5px) scale(0.98, 1.01);
            }
        }

        @keyframes slimeDead {
            0%, 100% {
                transform: scale(1.22, 0.65);
            }

            50% {
                transform: scale(1.26, 0.60);
            }
        }

        .health-meta {
            flex: 1;
        }

        .health-title {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .health-bar-bg {
            height: 8px;
            background: var(--panel-alt);
            border-radius: 999px;
            overflow: hidden;
            margin: 6px 0;
        }

        .health-bar-fill {
            height: 100%;
            background: var(--green);
            transition: width 0.3s;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 40px 16px;
        }

        /* Media Lightbox Modal */
        .media-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 22, 0.78);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

            .media-modal-backdrop.open {
                display: flex;
            }

        .media-modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .media-modal-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .media-modal-title {
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-modal-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .media-modal-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0c0e13;
            overflow: auto;
            min-height: 200px;
        }

            .media-modal-body video,
            .media-modal-body img {
                max-width: 100%;
                max-height: 70vh;
                border-radius: 6px;
            }

            .media-modal-body audio {
                width: 100%;
                max-width: 520px;
                margin: 24px 0;
            }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">💾 DiskScope v0.03</div>
        <select id="driveSelect" onchange="selectDrive(this.value)"></select>
        <button id="backBtn" onclick="goBack()">⬅ Back</button>
        <div class="path-bar" id="pathDisplay">Loading...</div>
        <button class="primary" id="scanBtn" onclick="triggerScan()">🔍 Scan Folder</button>
        <button id="themeBtn" onclick="toggleTheme()" title="Toggle Light / Dark Mode">🌙 Dark</button>
        <input id="pinInput" type="password" placeholder="PIN (optional)" style="width:110px" onchange="savePin(this.value)" />
    </div>

    <div class="status-strip">
        <div class="status-left">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Ready</span>
        </div>
        <div class="progress-track" id="scanProgress">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="searchbar">
        <input id="searchInput" type="text" placeholder="Search files in drive or folder..." oninput="onSearchInput()" />
        <select id="typeSelect" onchange="onSearchInput()">
            <option value="All">All Types</option>
            <option value="Videos">Videos</option>
            <option value="Archives">Archives</option>
            <option value="Images">Images</option>
            <option value="Audio">Audio</option>
            <option value="Executables">Executables</option>
        </select>
        <button id="clearSearchBtn" onclick="clearSearch()" style="display:none">✕ Clear</button>
    </div>

    <div class="workspace">
        <div class="browser-pane">
            <div class="pane-header">
                <span id="paneTitle">Folder Contents</span>
                <span id="itemCount">0 items</span>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="viz-pane">
            <div class="pill-switch">
                <button class="pill-btn active" id="tabPie" onclick="setVizTab('pie')">Pie Chart</button>
                <button class="pill-btn" id="tabTop" onclick="setVizTab('top')">Top 10 Largest Files</button>
            </div>

            <div class="card" id="pieCard">
                <div class="pie-wrap">
                    <canvas id="pieCanvas" width="240" height="240"></canvas>
                    <div class="legend" id="pieLegend"></div>
                </div>
            </div>

            <div class="card" id="topCard" style="display:none;">
                <div id="topList"></div>
            </div>

            <div class="card health-card">
                <div class="slime-stage" id="slimeStage">
                    <img id="slimeImg" class="slime-img happy" src="/slimes/happy.png" alt="Disk Health Slime" onerror="this.style.display='none'" />
                </div>
                <div class="health-meta">
                    <div class="health-title" id="healthTitle">Drive Health</div>
                    <div class="health-bar-bg"><div class="health-bar-fill" id="healthFill" style="width:50%"></div></div>
                    <div style="font-size:12px;color:var(--muted)" id="healthSub">Checking drive capacity...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Player / Link Viewer Modal -->
    <div class="media-modal-backdrop" id="mediaModal" onclick="if(event.target === this) closeMediaModal()">
        <div class="media-modal">
            <div class="media-modal-header">
                <div class="media-modal-title" id="mediaModalTitle">Media Preview</div>
                <div class="media-modal-actions">
                    <a class="btn-link primary" id="mediaDirectLink" href="#" target="_blank" rel="noopener">↗ Open Direct Link</a>
                    <button onclick="closeMediaModal()">✕ Close</button>
                </div>
            </div>
            <div class="media-modal-body" id="mediaModalBody"></div>
        </div>
    </div>

    <script>
        const COLORS = ["#2563eb", "#16a34a", "#d97706", "#dc2626", "#9333ea", "#0891b2", "#db2777", "#65a30d", "#ea580c", "#64748b"];
        const VIDEO_EXTS = new Set(["mp4", "m4v", "webm", "mkv", "mov", "avi", "wmv", "flv"]);
        const AUDIO_EXTS = new Set(["mp3", "wav", "flac", "ogg", "opus", "m4a", "aac"]);
        const IMAGE_EXTS = new Set(["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg"]);

        let drives = [];
        let currentDrive = "";
        let currentPath = "";
        let historyStack = [];
        let currentItems = [];
        let activeViz = "pie";
        let wasScanning = false;
        let searchTimer = null;

        const pinBox = document.getElementById("pinInput");
        pinBox.value = localStorage.getItem("diskscope_pin") || "";

        function getMediaKind(name, isDir) {
            if (isDir) return null;
            const dot = name.lastIndexOf(".");
            if (dot < 0) return null;
            const ext = name.slice(dot + 1).toLowerCase();
            if (VIDEO_EXTS.has(ext)) return "video";
            if (AUDIO_EXTS.has(ext)) return "audio";
            if (IMAGE_EXTS.has(ext)) return "image";
            return null;
        }

        function buildMediaUrl(filePath) {
            const pin = localStorage.getItem("diskscope_pin") || "";
            let url = `/api/media?path=${encodeURIComponent(filePath)}`;
            if (pin) url += `&pin=${encodeURIComponent(pin)}`;
            return url;
        }

        function openMediaPreview(filePath, fileName, kind) {
            const url = buildMediaUrl(filePath);
            const modal = document.getElementById("mediaModal");
            const title = document.getElementById("mediaModalTitle");
            const body = document.getElementById("mediaModalBody");
            const link = document.getElementById("mediaDirectLink");

            title.textContent = fileName;
            link.href = url;

            if (kind === "video") {
                body.innerHTML = `<video src="${escAttr(url)}" controls autoplay playsinline></video>`;
            } else if (kind === "audio") {
                body.innerHTML = `<div style="color:#e6eaf2;font-weight:600;margin-top:8px;">🎵 ${escHtml(fileName)}</div><audio src="${escAttr(url)}" controls autoplay></audio>`;
            } else if (kind === "image") {
                body.innerHTML = `<img src="${escAttr(url)}" alt="${escAttr(fileName)}" />`;
            }

            modal.classList.add("open");
        }

        function closeMediaModal() {
            const modal = document.getElementById("mediaModal");
            const body = document.getElementById("mediaModalBody");
            modal.classList.remove("open");
            body.innerHTML = "";
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeMediaModal();
        });

        function applySavedTheme() {
            const saved = localStorage.getItem("diskscope_theme") || "light";
            const isDark = saved === "dark";
            document.body.classList.toggle("dark", isDark);
            document.getElementById("themeBtn").textContent = isDark ? "☀️ Light" : "🌙 Dark";
            if (currentItems.length > 0) renderPieChart(currentItems);
        }

        function toggleTheme() {
            const next = document.body.classList.contains("dark") ? "light" : "dark";
            localStorage.setItem("diskscope_theme", next);
            applySavedTheme();
        }

        function savePin(val) {
            localStorage.setItem("diskscope_pin", val);
            init();
        }

        function apiHeaders() {
            const pin = localStorage.getItem("diskscope_pin") || "";
            return pin ? { "X-DiskScope-Pin": pin, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
        }

        function fmtBytes(bytes) {
            if (!bytes || bytes <= 0) return "0 B";
            const units = ["B", "KB", "MB", "GB", "TB"];
            let i = 0;
            let val = bytes;
            while (val >= 1024 && i < units.length - 1) {
                val /= 1024;
                i++;
            }
            return `${val.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
        }

        async function init() {
            applySavedTheme();
            const res = await fetch("/api/drives", { headers: apiHeaders() });
            if (res.status === 401) {
                document.getElementById("statusText").textContent = "Unauthorized — enter PIN in top right";
                return;
            }
            drives = await res.json();
            const sel = document.getElementById("driveSelect");
            sel.innerHTML = drives.map(d => `<option value="${escAttr(d.path)}">${escHtml(d.path)} (${fmtBytes(d.free)} free)</option>`).join("");
            if (drives.length > 0) {
                await selectDrive(drives[0].path);
            }
        }

        async function selectDrive(drivePath) {
            currentDrive = drivePath;
            historyStack = [];
            updateDriveHealth();
            await openFolder(drivePath, false, "none");
            await loadTopFiles();
        }

        function updateDriveHealth() {
            const d = drives.find(x => x.path === currentDrive);
            if (!d || !d.total) return;
            const used = Math.max(0, d.total - d.free);
            const freePct = (d.free / d.total) * 100;
            const usedPct = 100 - freePct;

            const fill = document.getElementById("healthFill");
            fill.style.width = `${usedPct.toFixed(1)}%`;

            const img = document.getElementById("slimeImg");
            let statusLabel = "Disk Healthy!";
            if (freePct > 60) {
                fill.style.background = "var(--green)";
                img.src = "/slimes/happy.png";
                img.className = "slime-img happy";
                statusLabel = "Disk Healthy!";
            } else if (freePct < 10) {
                fill.style.background = "var(--red)";
                img.src = "/slimes/dead.png";
                img.className = "slime-img dead";
                statusLabel = "Critical Space!";
            } else {
                fill.style.background = "var(--yellow)";
                img.src = "/slimes/shiver.png";
                img.className = "slime-img shiver";
                statusLabel = "Getting Low...";
            }

            document.getElementById("healthTitle").textContent = `Drive ${d.path} — ${Math.round(freePct)}% Free (${statusLabel})`;
            document.getElementById("healthSub").textContent = `${fmtBytes(used)} used / ${fmtBytes(d.total)} total (${fmtBytes(d.free)} free)`;
        }

        function playSwipe(dir) {
            const list = document.getElementById("fileList");
            list.classList.remove("slide-forward", "slide-backward");
            if (dir === "forward" || dir === "backward") {
                void list.offsetWidth;
                list.classList.add(dir === "forward" ? "slide-forward" : "slide-backward");
            }
        }

        async function openFolder(targetPath, pushHistory = true, swipeDir = "forward") {
            if (pushHistory && currentPath && currentPath !== targetPath) {
                historyStack.push(currentPath);
            }
            currentPath = targetPath;
            document.getElementById("pathDisplay").textContent = currentPath;
            document.getElementById("searchInput").value = "";
            document.getElementById("typeSelect").value = "All";
            document.getElementById("clearSearchBtn").style.display = "none";
            document.getElementById("paneTitle").textContent = "Folder Contents";
            document.getElementById("backBtn").disabled = historyStack.length === 0 && currentPath === currentDrive;

            await refreshCurrentFolder();
            playSwipe(swipeDir);
        }

        async function refreshCurrentFolder() {
            const res = await fetch(`/api/children?path=${encodeURIComponent(currentPath)}`, { headers: apiHeaders() });
            currentItems = await res.json();
            renderFileList(currentItems, false);
            renderPieChart(currentItems);
        }

        async function goBack() {
            if (historyStack.length > 0) {
                const prev = historyStack.pop();
                await openFolder(prev, false, "backward");
                return;
            }
            if (currentPath && currentPath !== currentDrive) {
                const trimmed = currentPath.replace(/[\\/]+$/, "");
                const idx = Math.max(trimmed.lastIndexOf("\\"), trimmed.lastIndexOf("/"));
                if (idx >= 0) {
                    let parent = trimmed.slice(0, idx);
                    if (/^[A-Za-z]:$/.test(parent)) parent += "\\";
                    if (!parent) parent = "/";
                    await openFolder(parent, false, "backward");
                }
            }
        }

        function renderFileList(items, isSearchMode) {
            const list = document.getElementById("fileList");
            document.getElementById("itemCount").textContent = `${items.length} items`;
            if (!items || items.length === 0) {
                list.innerHTML = `<div class="empty-state">${isSearchMode ? "No matching files found." : "This folder is empty or unreadable."}</div>`;
                return;
            }

            const maxSize = Math.max(...items.map(i => i.size || 0), 1);
            list.innerHTML = items.map(item => {
                const isLocked = item.is_dir && item.status === "scanning";
                const pct = item.size > 0 ? Math.max(2, Math.round((item.size / maxSize) * 100)) : 0;
                const mediaKind = getMediaKind(item.name, item.is_dir);

                const icon = isLocked
                    ? "⏳"
                    : item.is_dir
                        ? "📁"
                        : mediaKind === "video"
                            ? "🎬"
                            : mediaKind === "audio"
                                ? "🎵"
                                : mediaKind === "image"
                                    ? "🖼️"
                                    : "📄";

                let sizeLabel = "";
                if (isLocked) {
                    sizeLabel = `<span class="scanning-tag">Scanning...</span>`;
                } else if (!item.indexed && item.is_dir && item.size === 0) {
                    sizeLabel = `<span class="unscanned-tag">Unscanned</span>`;
                } else {
                    sizeLabel = `<span class="size-badge">${fmtBytes(item.size)}</span>`;
                }

                const mediaLinkBtn = mediaKind
                    ? `<a class="media-pill" href="${escAttr(buildMediaUrl(item.path))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open raw stream in new tab">${mediaKind === "image" ? "↗ View" : "▶ Play"}</a>`
                    : "";

                const subline = isSearchMode ? `<div class="item-sub">${escHtml(item.path)}</div>` : "";
                return `
              <div class="file-row ${isLocked ? "locked" : ""}" onclick="onRowClick('${escAttr(item.path)}', '${escAttr(item.name)}', ${item.is_dir}, ${isLocked})">
                <div class="size-bg" style="width:${pct}%"></div>
                <div class="row-left">
                  <span>${icon}</span>
                  <div style="min-width:0;flex:1">
                    <div class="item-name ${mediaKind ? "playable" : ""}">${escHtml(item.name)}</div>
                    ${subline}
                  </div>
                </div>
                <div class="row-right">
                  ${mediaLinkBtn}
                  ${sizeLabel}
                  <button class="danger" onclick="deleteItem(event, '${escAttr(item.path)}', ${item.size || 0})">Trash</button>
                </div>
              </div>`;
            }).join("");
        }

        function onRowClick(itemPath, itemName, isDir, isLocked) {
            if (isLocked) return;
            if (isDir) {
                openFolder(itemPath, true, "forward");
                return;
            }
            const mediaKind = getMediaKind(itemName, false);
            if (mediaKind) {
                openMediaPreview(itemPath, itemName, mediaKind);
            }
        }

        async function triggerScan() {
            const btn = document.getElementById("scanBtn");
            btn.disabled = true;
            document.getElementById("statusDot").classList.add("scanning");
            document.getElementById("scanProgress").classList.add("active");
            document.getElementById("statusText").textContent = `Scanning ${currentPath}...`;

            await fetch("/api/scan", {
                method: "POST",
                headers: apiHeaders(),
                body: JSON.stringify({ path: currentPath })
            });
            wasScanning = true;
            await refreshCurrentFolder();
        }

        async function pollScanStatus() {
            try {
                const res = await fetch("/api/status", { headers: apiHeaders() });
                if (!res.ok) return;
                const st = await res.json();
                const dot = document.getElementById("statusDot");
                const bar = document.getElementById("scanProgress");
                const txt = document.getElementById("statusText");
                const btn = document.getElementById("scanBtn");

                const isSearching = document.getElementById("searchInput").value.trim() !== "" || document.getElementById("typeSelect").value !== "All";

                if (st.scanning) {
                    wasScanning = true;
                    btn.disabled = true;
                    dot.classList.add("scanning");
                    bar.classList.add("active");
                    txt.textContent = `Scanning files in ${st.target}... (${st.items_processed.toLocaleString()} items — completed folders unlocked)`;
                    if (!isSearching) {
                        await refreshCurrentFolder();
                    }
                } else {
                    btn.disabled = false;
                    dot.classList.remove("scanning");
                    bar.classList.remove("active");
                    if (wasScanning) {
                        wasScanning = false;
                        txt.textContent = st.status || "Done scanning";
                        if (!isSearching) {
                            await refreshCurrentFolder();
                        }
                        await loadTopFiles();
                    } else if (st.status && st.status !== "Ready") {
                        txt.textContent = st.status;
                    }
                }
            } catch (_) { }
        }
        setInterval(pollScanStatus, 650);

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("typeSelect").value = "All";
            document.getElementById("clearSearchBtn").style.display = "none";
            document.getElementById("paneTitle").textContent = "Folder Contents";
            renderFileList(currentItems, false);
        }

        function onSearchInput() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                const q = document.getElementById("searchInput").value.trim();
                const type = document.getElementById("typeSelect").value;
                document.getElementById("clearSearchBtn").style.display = (q || type !== "All") ? "inline-block" : "none";

                if (!q && type === "All") {
                    document.getElementById("paneTitle").textContent = "Folder Contents";
                    renderFileList(currentItems, false);
                    return;
                }
                document.getElementById("paneTitle").textContent = "Searching...";
                const url = `/api/search?drive=${encodeURIComponent(currentDrive)}&path=${encodeURIComponent(currentPath)}&q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}`;
                const res = await fetch(url, { headers: apiHeaders() });
                const results = await res.json();
                document.getElementById("paneTitle").textContent = "Search Results";
                renderFileList(results, true);
            }, 220);
        }

        function setVizTab(tab) {
            activeViz = tab;
            document.getElementById("tabPie").classList.toggle("active", tab === "pie");
            document.getElementById("tabTop").classList.toggle("active", tab === "top");
            document.getElementById("pieCard").style.display = tab === "pie" ? "block" : "none";
            document.getElementById("topCard").style.display = tab === "top" ? "block" : "none";
            if (tab === "top") loadTopFiles();
        }

        function renderPieChart(items) {
            const canvas = document.getElementById("pieCanvas");
            const ctx = canvas.getContext("2d");
            const legend = document.getElementById("pieLegend");
            const styles = getComputedStyle(document.body);
            const holeColor = styles.getPropertyValue("--donut-hole").trim() || "#ffffff";
            const emptyRingColor = styles.getPropertyValue("--border").trim() || "#d0d7e2";

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const sized = items.filter(i => i.size > 0).slice(0, 9);
            const restSize = items.slice(9).reduce((acc, i) => acc + (i.size || 0), 0);
            if (restSize > 0) sized.push({ name: "Other", size: restSize });

            const total = sized.reduce((acc, i) => acc + i.size, 0);
            if (total <= 0) {
                ctx.fillStyle = emptyRingColor;
                ctx.beginPath();
                ctx.arc(120, 120, 95, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(120, 120, 46, 0, Math.PI * 2);
                ctx.fillStyle = holeColor;
                ctx.fill();
                legend.innerHTML = `<div style="color:var(--muted);grid-column:1/-1;text-align:center">Click <b>Scan Folder</b> to calculate folder sizes for the pie chart.</div>`;
                return;
            }

            let startAngle = -Math.PI / 2;
            sized.forEach((slice, idx) => {
                const angle = (slice.size / total) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(120, 120);
                ctx.arc(120, 120, 100, startAngle, startAngle + angle);
                ctx.closePath();
                ctx.fillStyle = COLORS[idx % COLORS.length];
                ctx.fill();
                startAngle += angle;
            });

            ctx.beginPath();
            ctx.arc(120, 120, 48, 0, Math.PI * 2);
            ctx.fillStyle = holeColor;
            ctx.fill();

            legend.innerHTML = sized.map((s, idx) => `
            <div class="legend-item">
              <span class="swatch" style="background:${COLORS[idx % COLORS.length]}"></span>
              <span class="legend-name" title="${escAttr(s.name)}">${escHtml(s.name)}</span>
              <span class="legend-sz">${fmtBytes(s.size)}</span>
            </div>`).join("");
        }

        async function loadTopFiles() {
            const res = await fetch(`/api/top?drive=${encodeURIComponent(currentDrive)}`, { headers: apiHeaders() });
            const items = await res.json();
            const topList = document.getElementById("topList");
            if (!items || items.length === 0) {
                topList.innerHTML = `<div class="empty-state">No indexed files yet. Run a scan first.</div>`;
                return;
            }
            topList.innerHTML = items.map((item, idx) => {
                const mediaKind = getMediaKind(item.name, false);
                const mediaLinkBtn = mediaKind
                    ? `<a class="media-pill" href="${escAttr(buildMediaUrl(item.path))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${mediaKind === "image" ? "↗ View" : "▶ Play"}</a>`
                    : "";
                return `
            <div class="file-row" style="cursor:${mediaKind ? "pointer" : "default"}" onclick="${mediaKind ? `openMediaPreview('${escAttr(item.path)}', '${escAttr(item.name)}', '${mediaKind}')` : ""}">
              <div class="row-left">
                <span style="color:var(--muted);font-weight:700">#${idx + 1}</span>
                <div style="min-width:0;flex:1">
                  <div class="item-name ${mediaKind ? "playable" : ""}">${escHtml(item.name)}</div>
                  <div class="item-sub">${escHtml(item.path)}</div>
                </div>
              </div>
              <div class="row-right">
                ${mediaLinkBtn}
                <span class="size-badge">${fmtBytes(item.size)}</span>
              </div>
            </div>`;
            }).join("");
        }

        async function deleteItem(ev, itemPath, size) {
            ev.stopPropagation();
            if (!confirm(`Move to Recycle Bin / Trash?\n${itemPath}`)) return;
            const res = await fetch("/api/delete", {
                method: "POST",
                headers: apiHeaders(),
                body: JSON.stringify({ path: itemPath, size })
            });
            const data = await res.json();
            document.getElementById("statusText").textContent = data.message || "Deleted";
            await refreshCurrentFolder();
            await loadTopFiles();
        }

        function escHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function escAttr(s) {
            return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }

        init();
    </script>
</body>
